name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify tag matches csproj version
        shell: pwsh
        run: |
          [xml]$csproj = Get-Content src/SimpleRay.App/SimpleRay.App.csproj
          $ver = ($csproj.Project.PropertyGroup.Version | Where-Object { $_ }) | Select-Object -First 1
          $tag = "${{ github.ref_name }}".TrimStart('v')
          if ($ver -ne $tag) { throw "csproj <Version> ($ver) does not match tag ($tag). Bump the csproj first." }
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Fetch verified runtime deps (sing-box, wintun, geo)
        shell: pwsh
        run: ./scripts/fetch-deps.ps1

      - name: Build and test
        run: dotnet test SimpleRay.sln -c Release

      - name: Build portable package
        shell: pwsh
        run: ./scripts/publish-portable.ps1

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DAppVersion=$env:VERSION" scripts\installer.iss
          $setup = "dist\SimpleRay-$env:VERSION-setup.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          Set-Content -Path "$setup.sha256" -Value "$hash *SimpleRay-$env:VERSION-setup.exe" -Encoding ascii

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ver = $env:VERSION
          $prerelease = if ("${{ github.ref_name }}" -match '-') { '--prerelease' } else { '' }
          $args = @(
            'release','create',"${{ github.ref_name }}",
            "dist/SimpleRay-$ver-setup.exe",
            "dist/SimpleRay-$ver-setup.exe.sha256",
            "dist/SimpleRay-$ver-win-x64.zip",
            "dist/SimpleRay-$ver-win-x64.zip.sha256",
            '--title',"SimpleRay $ver",
            '--generate-notes'
          )
          if ($prerelease) { $args += $prerelease }
          gh @args
