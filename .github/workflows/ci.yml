name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Before the build, which copies them into bin: some tests validate generated configs
      # with the real sing-box (and fail on purpose without it), as the release workflow does.
      - name: Fetch verified runtime deps (sing-box, wintun, geo)
        shell: pwsh
        run: ./scripts/fetch-deps.ps1

      - name: Restore
        run: dotnet restore SimpleRay.sln

      - name: Build
        run: dotnet build SimpleRay.sln -c Release --no-restore

      - name: Test
        run: dotnet test SimpleRay.sln -c Release --no-build --verbosity normal
